<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Gaspard le Veilleur : capuche, lanterne allumée -->
  <circle cx="60" cy="64" r="40" fill="#f5ecd8" stroke="#6b4f2a" stroke-width="3"/>
  <!-- manteau -->
  <path d="M32 100 Q60 76 88 100 Z" fill="#5b6d8f" stroke="#6b4f2a" stroke-width="3"/>
  <!-- tête -->
  <circle cx="60" cy="54" r="22" fill="#f5ecd8" stroke="#6b4f2a" stroke-width="3"/>
  <!-- capuche -->
  <path d="M36 52 Q36 26 60 26 Q84 26 84 52 Q72 40 60 40 Q48 40 36 52 Z" fill="#5b6d8f" stroke="#6b4f2a" stroke-width="3"/>
  <!-- barbe -->
  <path d="M50 62 Q60 78 70 62 Q60 68 50 62 Z" fill="#d8d3c5" stroke="#6b4f2a" stroke-width="2"/>
  <!-- yeux -->
  <circle cx="53" cy="54" r="3" fill="#6b4f2a"/>
  <circle cx="67" cy="54" r="3" fill="#6b4f2a"/>
  <!-- lanterne -->
  <rect x="86" y="70" width="14" height="16" rx="3" fill="#e8a020" stroke="#6b4f2a" stroke-width="2.5"/>
  <path d="M93 66 L93 70" stroke="#6b4f2a" stroke-width="2.5"/>
  <circle cx="93" cy="78" r="3.5" fill="#fff3c4"/>
  <!-- étoiles (nuit) -->
  <path d="M30 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" fill="#e8a020"/>
  <circle cx="96" cy="34" r="2" fill="#e8a020"/>
  <circle cx="26" cy="48" r="1.5" fill="#e8a020"/>
</svg>
