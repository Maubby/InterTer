<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Ferrand le Pillard : sac de butin sur l'épaule, sourire en coin -->
  <circle cx="60" cy="64" r="40" fill="#f5ecd8" stroke="#6b4f2a" stroke-width="3"/>
  <!-- tunique -->
  <path d="M32 100 Q60 76 88 100 Z" fill="#4a7c47" stroke="#6b4f2a" stroke-width="3"/>
  <!-- tête -->
  <circle cx="58" cy="54" r="23" fill="#f5ecd8" stroke="#6b4f2a" stroke-width="3"/>
  <!-- bandana -->
  <path d="M36 48 Q58 34 80 48 L76 42 Q58 30 40 42 Z" fill="#c8102e" stroke="#6b4f2a" stroke-width="3"/>
  <!-- yeux malicieux -->
  <circle cx="51" cy="54" r="3" fill="#6b4f2a"/>
  <path d="M64 52 q5 2 4 5" stroke="#6b4f2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- sourire en coin -->
  <path d="M49 63 Q60 70 70 61" fill="none" stroke="#6b4f2a" stroke-width="3" stroke-linecap="round"/>
  <!-- sac de butin -->
  <path d="M84 42 q14 4 10 18 q-4 14 -18 8 q-6 -12 8 -26 Z" fill="#a4713d" stroke="#6b4f2a" stroke-width="3"/>
  <path d="M86 40 q6 -6 10 -2" stroke="#6b4f2a" stroke-width="2.5" fill="none"/>
  <!-- objets dépassant -->
  <circle cx="92" cy="48" r="4" fill="#e8a020" stroke="#6b4f2a" stroke-width="2"/>
  <path d="M98 56 l6 6 M104 54 l-4 8" stroke="#6b4f2a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
